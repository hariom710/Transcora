<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Transcora</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --bg: #ffffff;
        --border: #d2d2d7;
        --accent: #0071e3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f5f5f7;
          --muted: #a1a1a6;
          --bg: #1d1d1f;
          --border: #424245;
          --accent: #0a84ff;
        }
      }
      body {
        margin: 0;
        width: 260px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 16px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 500;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Transcora</h1>
    <p id="status">Reading this tab…</p>
    <button id="open" disabled>Get transcript</button>
    <script src="popup.js"></script>
  </body>
</html>
